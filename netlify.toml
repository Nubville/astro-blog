[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# GitHub OAuth handshake for Sveltia CMS (/admin). See
# netlify/functions/auth.js + callback.js.
[[redirects]]
  from = "/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200

# Security headers. Netlify applies matching [[headers]] blocks in file
# order, so this general block goes first and the /admin + /callback
# overrides below it win on those paths. The public site gets a strict CSP;
# /admin (Sveltia CMS, loaded from unpkg.com) and /callback (which hands the
# GitHub OAuth token back to the CMS popup via a dynamically-generated
# inline <script>, so it can't use a static script hash) need more room.
# /admin is already noindex/nofollow and gated by GitHub repo access, so a
# looser policy there is a reasonable trade-off. If CMS login breaks after
# this deploys, check the browser console for the blocked directive/domain.
#
# script-src is 'self'-only: astro.config.mjs sets
# vite.build.assetsInlineLimit: 0 specifically so every hoisted <script>
# (nav toggle, code-copy, sketch-card) always emits as an external
# /_astro/*.js file instead of inline JS — verified in the actual
# `npm run build` output — so no 'unsafe-inline' is needed here. The
# application/ld+json blocks are inert to script-src (not a script MIME
# type). style-src still needs 'unsafe-inline' for a few inline style="..."
# attributes in post content and the design-tokens page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com https://github.com https://avatars.githubusercontent.com; worker-src 'self' blob:; frame-ancestors 'self'"

[[headers]]
  for = "/callback"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'unsafe-inline'"
